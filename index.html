<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Code</title>
<meta name="theme-color" content="#0e1a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e8edf2;--ink:#12202f;--mute:#5a6b7d;--card:#fff;--line:#b8c4d0;--board:#0e1a2b;--amber:#ffb81c;--ok:#2e8b57;--bad:#c0392b;--acc:#0b6e99;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a121d;--ink:#e6edf4;--mute:#8fa1b5;--card:#14202f;--line:#2f4157;--board:#050b14;--ok:#5fc48a;--bad:#ef7b6d;--acc:#5bc0eb}}
:root[data-theme="dark"]{--bg:#0a121d;--ink:#e6edf4;--mute:#8fa1b5;--card:#14202f;--line:#2f4157;--board:#050b14;--ok:#5fc48a;--bad:#ef7b6d;--acc:#5bc0eb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:1.45rem;margin:2px 0 12px;letter-spacing:.01em}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.q small{color:var(--mute)}
.q h2{margin:2px 0 0;font-size:1.35rem}
.board{display:flex;gap:8px;justify-content:center;background:var(--board);padding:16px;border-radius:10px;margin-bottom:12px}
.fl{width:58px;height:78px;border-radius:6px;background:linear-gradient(#1c2c44 49%,#050b14 50%,#1c2c44 51%);color:var(--amber);font:700 2.6rem/78px ui-monospace,Menlo,Consolas,monospace;text-align:center}
.fl.cur{outline:2px solid var(--amber)}
.fl.hint{color:#8fd3ff}
.fb{min-height:1.5em;text-align:center;font-weight:600;margin:0 0 10px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
#kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:10px}
button.k{min-width:32px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:600 1rem system-ui,sans-serif;cursor:pointer}
button.k:active{background:var(--line)}
.row{display:flex;gap:8px}
.row button,.opt{height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 1rem system-ui,sans-serif;cursor:pointer;padding:0 12px}
.row button{flex:1}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;height:auto;min-height:46px;padding:10px 12px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.wrong{opacity:.45;text-decoration:line-through}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.end{text-align:center}.end .big{font-size:2.4rem;font-weight:700;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Gate Code</h1>
<div class="tabs" role="group" aria-label="Spielmodus">
<button id="m1" aria-pressed="true">Code erraten</button>
<button id="m2" aria-pressed="false">Stadt erraten</button>
</div>
<div id="g"></div>
</main>
<script src="airports.js"></script>
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const A=window.AP;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode=1,qs,qi,score,done,buf,wrong,hintN,fb,opts,dis,pts;
function newGame(){qs=sh(A).slice(0,10);qi=0;score=0;load()}
function load(){done=false;buf="";wrong=0;hintN=0;fb="";dis=[];pts=3;const q=qs[qi];
  if(mode===2)opts=sh([q].concat(sh(A.filter(a=>a!==q)).slice(0,3)));render()}
function left(){return Math.max(0,3-wrong-hintN)}
function render(){
  const g=$("g");
  if(qi>=10){
    const txt="Gate Code "+score+"/30 ("+(mode===1?"Code erraten":"Stadt erraten")+")";
    g.innerHTML='<div class="q end"><small>Alle zehn Flüge gelandet</small><div class="big">'+score+' von 30</div><p>'+(score>=25?"Fast fehlerfrei.":score>=15?"Solide Landung.":"Noch etwas Übung am Gate.")+'</p></div><div class="row"><button onclick="newGame()">Nochmal</button><button id="cp">Ergebnis kopieren</button></div>';
    $("cp").onclick=()=>{try{navigator.clipboard.writeText(txt);$("cp").textContent="Kopiert"}catch(e){$("cp").textContent=txt}};return}
  const q=qs[qi];
  let h='<div class="top"><span>Flug '+(qi+1)+' von 10</span><span>Punkte: '+score+'</span></div>';
  if(mode===1){
    const full=q[0].slice(0,hintN)+buf;
    h+='<div class="q"><small>'+q[2]+'</small><h2>'+q[1]+'</h2></div><div class="board">';
    for(let i=0;i<3;i++){const c=done?q[0][i]:full[i]||"";h+='<div class="fl'+(i<hintN&&!done?" hint":"")+(!done&&i===full.length?" cur":"")+'">'+c+'</div>'}
    h+='</div><p class="fb '+(done?(pts>0?"ok":"bad"):"bad")+'" role="status">'+fb+'</p>';
    if(!done){h+='<div id="kb">'+"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c=>'<button class="k" onclick="typeL(\''+c+'\')">'+c+'</button>').join("")+'<button class="k" style="min-width:60px" onclick="back()">⌫</button></div><div class="row"><button onclick="hint()" '+(left()>1&&hintN<2?"":"disabled")+'>Tipp (−1)</button></div>'}
    else h+='<div class="row"><button onclick="nextQ()">'+(qi<9?"Weiter":"Ergebnis")+'</button></div>';
  }else{
    h+='<div class="board">'+q[0].split("").map(c=>'<div class="fl">'+c+'</div>').join("")+'</div><p class="fb '+(done?(pts>0?"ok":"bad"):"bad")+'" role="status">'+fb+'</p>';
    opts.forEach((o,i)=>{h+='<button class="opt'+(done&&o===q?" right":"")+(dis.includes(i)?" wrong":"")+'" '+(done||dis.includes(i)?"disabled":"")+' onclick="pick('+i+')">'+o[1]+'<br><small style="color:var(--mute)">'+o[2]+'</small></button>'});
    if(done)h+='<div class="row"><button onclick="nextQ()">'+(qi<9?"Weiter":"Ergebnis")+'</button></div>';
  }
  g.innerHTML=h;
}
function finish(ok){done=true;pts=ok?left():0;score+=pts;fb=ok?"Richtig! +"+pts+" Punkte":"Das war "+qs[qi][0]+" – 0 Punkte";render()}
function typeL(c){if(done)return;const q=qs[qi];buf+=c;
  if(hintN+buf.length===3){if(q[0].slice(0,hintN)+buf===q[0])return finish(true);
    wrong++;buf="";if(left()<=0)return finish(false);fb="Nicht ganz – noch "+left()+" Punkt"+(left()>1?"e":"")}
  render()}
function back(){buf=buf.slice(0,-1);render()}
function hint(){if(left()>1&&hintN<2){hintN++;buf=buf.slice(0,3-hintN);fb="";render()}}
function pick(i){if(done)return;if(opts[i]===qs[qi])return finish(true);dis.push(i);wrong++;fb="Falsch – noch "+left()+" Punkt"+(left()===1?"":"e");render()}
function nextQ(){qi++;load()}
document.addEventListener("keydown",e=>{if(mode!==1||qi>=10)return;
  if(/^[a-zA-Z]$/.test(e.key))typeL(e.key.toUpperCase());else if(e.key==="Backspace")back();else if(e.key==="Enter"&&done)nextQ()});
[["m1",1],["m2",2]].forEach(([id,m])=>$(id).onclick=()=>{mode=m;$("m1").setAttribute("aria-pressed",m===1);$("m2").setAttribute("aria-pressed",m===2);newGame()});
newGame();
</script>
</body>
</html>
